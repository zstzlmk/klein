<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kleinanzeigen Upload</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a1a;--sf:#242424;--sf2:#2e2e2e;--bd:#3a3a3a;--tx:#e0e0e0;--tx2:#999;--ac:#b5e941;--ac2:#326916}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
.drag{-webkit-app-region:drag;position:fixed;top:0;left:0;right:0;height:38px;z-index:50}
button,input,textarea,select,a{-webkit-app-region:no-drag}
.side{width:260px;min-width:260px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.side-hdr{padding:48px 16px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px}
.side-hdr button{flex:1;padding:6px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);cursor:pointer;font-size:12px}
.side-hdr button:hover{background:var(--bd)}
.side-hdr button.chrome-on{border-color:var(--ac);color:var(--ac)}
.list{flex:1;overflow-y:auto;padding:8px}
.card{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card:hover{background:var(--sf2)}.card.active{background:var(--ac2)}.card.bulk-sel{outline:2px solid var(--ac);outline-offset:-2px}
.card .th{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--sf2);flex-shrink:0}
.card .inf{overflow:hidden}.card .inf .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .inf .mt{font-size:11px;color:var(--tx2)}
.bbar{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);padding:10px 16px;display:none;align-items:center;gap:12px;z-index:90;flex-wrap:wrap}
.bbar.vis{display:flex}
.bbar .b-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);min-width:160px}
.bbar .b-info b{color:var(--tx);font-size:13px}
.bbar .b-info button{padding:4px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);cursor:pointer;font-size:11px}
.bbar .b-info button:hover{background:var(--bd)}
.bbar .b-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.bbar .b-edit .b-group{display:flex;gap:4px;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:3px 4px}
.bbar .b-edit select{padding:6px 8px;background:transparent;border:none;color:var(--tx);font-size:12px;min-width:130px;cursor:pointer}
.bbar .b-edit select:focus{outline:none}
.bbar .b-edit button{padding:5px 10px;background:var(--bd);border:none;border-radius:5px;color:var(--tx);cursor:pointer;font-size:11px;font-weight:600}
.bbar .b-edit button:hover{background:#4a4a4a}
.bbar button.primary{padding:9px 18px;background:var(--ac);color:#1a1a1a;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
.bbar button.primary:disabled{opacity:.4;cursor:not-allowed}
.main.has-bbar{padding-bottom:80px}
.card .chk{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid var(--bd);border-radius:3px;flex-shrink:0;cursor:pointer;position:relative;background:var(--sf2)}
.card .chk:checked{background:var(--ac);border-color:var(--ac)}
.card .chk:checked:after{content:"✓";position:absolute;color:#1a1a1a;font-size:10px;font-weight:700;top:-2px;left:1px}
.card.posted{opacity:.55}.card.posted:hover{opacity:.85}
.card .tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--ac2);color:var(--ac);margin-right:6px;vertical-align:middle}
.card .tag.muted{background:var(--sf2);color:var(--tx2);font-weight:500}
/* Inline modal for prompts/inputs */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:20px;min-width:320px;max-width:90vw}
.modal h3{font-size:14px;margin-bottom:12px}
.modal input{width:100%;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;margin-bottom:12px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end}
.modal button{padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);cursor:pointer;font-size:12px}
.modal button.primary{background:var(--ac);color:#1a1a1a;border-color:var(--ac);font-weight:700}
.main{flex:1;overflow-y:auto;padding:48px 32px 32px;max-width:720px}
.main.empty{display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:15px;max-width:none}
.sec{margin-bottom:28px}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--tx2);letter-spacing:.8px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;padding:8px 10px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:13px;font-family:inherit}
.fld textarea{resize:vertical;min-height:80px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--ac)}
.fld input:disabled,.fld select:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px}.row .fld{flex:1}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;min-height:80px;padding:8px;background:var(--sf2);border-radius:8px;border:2px dashed var(--bd)}
.pitem{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;cursor:grab}
.pitem img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pitem .num{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pitem .badge{position:absolute;bottom:2px;left:2px;background:var(--ac);color:#1a1a1a;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.pitem .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center}
.pitem:hover .rm{display:flex}.pitem.dragging{opacity:.4}
.padd{width:88px;height:88px;border-radius:6px;border:2px dashed var(--bd);background:none;color:var(--tx2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:4px}
.padd:hover{border-color:var(--ac);color:var(--ac)}
.sbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--tx);z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:90vw;opacity:0;pointer-events:none;transition:opacity .15s ease}.sbar.vis{opacity:1}
</style>
</head>
<body>
<div class="drag"></div>
<div class="side">
    <div class="side-hdr"><button onclick="newItem()">+ Neu</button><button id="chromeBtn" onclick="launchChrome()" title="Chrome mit Debug-Port starten">🌐</button><button onclick="refreshShipping()" title="Versand-Preise aktualisieren">🔄</button><button onclick="changeFolder()">📁</button></div>
    <div class="list" id="itemList"></div>
</div>
<div class="main empty" id="mp"><span>Wähle ein Item aus der Liste</span></div>
<div class="sbar" id="sbar"></div>
<div class="bbar" id="bulkBar">
    <div class="b-info">
        <b id="bulkCount">0 ausgewählt</b>
        <button onclick="bulkSelectAll()">Alle</button>
        <button onclick="bulkClear()">Leeren</button>
    </div>
    <div class="b-edit">
        <div class="b-group">
            <select id="be-versand"><option value="">Versandart…</option><option value="nein">Nur Abholung</option><option value="ja">Versand möglich</option></select>
            <button onclick="bulkApplyVersand()">Setzen</button>
        </div>
        <div class="b-group" id="be-ship-row" style="display:none">
            <select id="be-s0"></select>
            <select id="be-s1"></select>
            <button onclick="bulkApplyShipping()">Setzen</button>
        </div>
        <div class="b-group">
            <select id="be-buynow"><option value="">Direkt kaufen…</option><option value="true">Aktivieren</option><option value="false">Deaktivieren</option></select>
            <button onclick="bulkApplyBuyNow()">Setzen</button>
        </div>
    </div>
    <button class="primary" id="bulkBtn" onclick="runBulk()" disabled>Posten (0)</button>
</div>
<script>
let items=[],catData=null,activeItem=null,bulkSel=new Set(),dragIdx=null,SHIPS=null;
const SHIPS_FALLBACK=[{v:'',l:'— Keine —'},{v:'HERMES_001',l:'Hermes Päckchen'},{v:'HERMES_002',l:'Hermes S-Paket'},{v:'HERMES_003',l:'Hermes M-Paket'},{v:'HERMES_004',l:'Hermes L-Paket'},{v:'DHL_001',l:'DHL 2kg'},{v:'DHL_002',l:'DHL 5kg'},{v:'DHL_003',l:'DHL 10kg'},{v:'DHL_005',l:'DHL 20kg'},{v:'DHL_004',l:'DHL 31,5kg'}];
function fmtCent(c){if(c==null)return'';return(c/100).toFixed(2).replace('.',',')+'€'}
function getShips(){if(SHIPS)return SHIPS;return SHIPS_FALLBACK}
function setShips(scraped){
  if(!scraped||!Array.isArray(scraped.options)){SHIPS=null;return}
  const opts=[{v:'',l:'— Keine —'}];
  for(const o of scraped.options){
    const price=fmtCent(o.priceInEuroCent);
    const old=o.oldPriceInEuroCent?` (vorher ${fmtCent(o.oldPriceInEuroCent)})`:'';
    opts.push({v:o.id,l:`${o.carrierName} ${o.name} — ${price}${old}`,raw:o});
  }
  SHIPS=opts;
}
function getParents(){if(!catData?.tree?.children)return[];return catData.tree.children.map(c=>({id:c.fieldValue,name:c.name}))}
function getSubcategories(pn){if(!catData?.tree?.children)return[];const p=catData.tree.children.find(c=>c.name===pn);if(!p?.children)return[];return p.children.map(c=>({id:c.fieldValue,name:c.name,fieldName:c.fieldName,hasArt:!!(c.children&&c.children.length>0),children:c.children||[]}))}
function getLeaves(pn,sn){const subs=pn?getSubcategories(pn):[];const sub=subs.find(s=>s.name===sn);if(!sub||!sub.children||!sub.children.length)return[];return sub.children.map(c=>({id:c.fieldValue,name:c.name,fieldName:c.fieldName}))}
function getSchema(cid){return catData?.attributeSchemas?.[String(cid)]||null}
function activeCategoryId(d){const{parent,sub,leaf}=parseCatPath(d.categoryPath);const subs=parent?getSubcategories(parent):[];const subObj=subs.find(s=>s.name===sub);if(!subObj)return null;if(subObj.children&&subObj.children.length){const leafObj=subObj.children.find(c=>c.name===leaf);return leafObj?leafObj.fieldValue:null}return subObj.id}
function parseCatPath(p){if(!p)return{parent:'',sub:'',leaf:''};const ps=p.split('>').map(s=>s.trim());return{parent:ps[0]||'',sub:ps[1]||'',leaf:ps[2]||''}}
function migrateLegacyPath(d){const{parent,sub,leaf}=parseCatPath(d.categoryPath||'');if(leaf||!parent||!sub)return false;const subs=getSubcategories(parent);const subObj=subs.find(s=>s.name===sub);if(!subObj||!subObj.children||!subObj.children.length)return false;const artKey=d.dynamicFields&&Object.keys(d.dynamicFields).find(k=>/\.art_s$/.test(k));const artVal=artKey?d.dynamicFields[artKey]:null;if(!artVal)return false;const leafObj=subObj.children.find(c=>c.fieldValue===artVal);if(leafObj){d.categoryPath=`${parent} > ${sub} > ${leafObj.name}`;return true}return false}
const PT=[{v:'FIXED',l:'Festpreis'},{v:'NEGOTIABLE',l:'VB'},{v:'GIVE_AWAY',l:'Zu verschenken'}];
const CONDS=[{v:'',l:'— Nicht gesetzt —'},{v:'new_with_tag',l:'Neu mit Etikett'},{v:'new',l:'Neu'},{v:'like_new',l:'Sehr Gut'},{v:'ok',l:'Gut'},{v:'alright',l:'In Ordnung'}];
function sel(id,opts,cur){return`<select id="${id}">${opts.map(o=>`<option value="${esc(o.v)}"${o.v===cur?' selected':''}${o.title?` title="${esc(o.title)}"`:''}>${esc(o.l)}</option>`).join('')}</select>`}
// Shipping-specific select with optgroups by package size and description tooltips.
function shipSel(id,opts,cur){
  const empty=opts.find(o=>!o.v);
  const groups={SMALL:[],MEDIUM:[],LARGE:[],OTHER:[]};
  for(const o of opts){if(!o.v)continue;const g=(o.raw&&o.raw.packageSize)||'OTHER';groups[g].push(o)}
  const labels={SMALL:'Klein',MEDIUM:'Mittel',LARGE:'Groß',OTHER:'Sonstige'};
  const optHtml=o=>`<option value="${esc(o.v)}"${o.v===cur?' selected':''}${o.raw&&o.raw.description?` title="${esc(o.raw.description)}"`:''}>${esc(o.l)}</option>`;
  let out=`<select id="${id}">`;
  if(empty)out+=`<option value=""${cur===''?' selected':''}>${esc(empty.l)}</option>`;
  for(const g of ['SMALL','MEDIUM','LARGE','OTHER']){if(!groups[g].length)continue;out+=`<optgroup label="${labels[g]}">${groups[g].map(optHtml).join('')}</optgroup>`}
  out+='</select>';return out;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
let saveTimer=null;function saveDebounced(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;save()},250)}
// Force any pending debounced save to run synchronously, returning when disk write completes.
async function flushSave(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await save()}}
async function init(){const[{folder,items:ld},cats,ship]=await Promise.all([window.api.getItems(),window.api.getCategories(),window.api.getShippingOptions()]);items=ld;catData=cats;setShips(ship);renderList();populateBulkSelects();if(!folder)status('Kein Projektordner. Klicke 📁');if(!catData)status('categories.json fehlt. npm run scrape ausführen.')}
function isPostedRecently(d){if(!d||!d.posted)return false;const t=Date.parse(d.posted);if(isNaN(t))return false;return(Date.now()-t)<24*60*60*1000}
function renderList(){const el=document.getElementById('itemList');el.innerHTML='';for(const item of items){const recent=isPostedRecently(item.data);const c=document.createElement('div');c.className='card'+(activeItem?.name===item.name?' active':'')+(bulkSel.has(item.path)?' bulk-sel':'')+(recent?' posted':'');
const chk=document.createElement('input');chk.type='checkbox';chk.className='chk';chk.checked=bulkSel.has(item.path);chk.onclick=e=>{e.stopPropagation();if(chk.checked)bulkSel.add(item.path);else bulkSel.delete(item.path);updBulk();renderList()};c.appendChild(chk);
if(item.images.length>0){const img=document.createElement('img');img.className='th';window.api.getThumbnail(item.path+'/'+item.images[0]).then(p=>img.src='file://'+p);img.onerror=()=>{img.style.background='var(--sf2)';img.removeAttribute('src')};c.appendChild(img)}else{const d=document.createElement('div');d.className='th';c.appendChild(d)}
const inf=document.createElement('div');inf.className='inf';const postedTag=item.data.posted?`<span class="tag${recent?'':' muted'}" title="Gepostet ${esc(new Date(item.data.posted).toLocaleString('de-DE'))}">${esc(fmtPosted(item.data.posted,recent))}</span>`:'';inf.innerHTML=`<div class="nm">${esc(item.data.title||item.name)}</div><div class="mt">${postedTag}${item.data.price?item.data.price+' €':'—'} · ${item.images.length} Bilder</div>`;c.appendChild(inf);
c.onclick=async()=>{await flushSave();activeItem=item;renderList();renderDetail(item)};
el.appendChild(c)}}
function fmtPosted(iso,recent){const d=new Date(iso);const time=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});if(recent){const now=new Date();const sameDay=d.toDateString()===now.toDateString();const y=new Date(now);y.setDate(y.getDate()-1);const sameYday=d.toDateString()===y.toDateString();if(sameDay)return'heute '+time;if(sameYday)return'gestern '+time}return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+time}
function renderDetail(item){const mp=document.getElementById('mp');mp.className='main';const d=item.data;const migrated=migrateLegacyPath(d);if(migrated){window.api.saveItem(item.path,d)}const{parent,sub,leaf}=parseCatPath(d.categoryPath);const shipping=d.shippingOptions||[];const versandKey=d.dynamicFields?Object.keys(d.dynamicFields).find(k=>k.includes('versand')):null;const versandVal=d.versandMode||(versandKey?d.dynamicFields[versandKey]:null)||(shipping.length>0?'ja':d.customShippingCost?'custom':'nein');const parents=getParents();const parentOpts=[{v:'',l:'— Wählen —'},...parents.map(p=>({v:p.name,l:p.name}))];const subs=parent?getSubcategories(parent):[];const subOpts=[{v:'',l:'— Wählen —'},...subs.map(s=>({v:s.name,l:s.name}))];const subObj=subs.find(s=>s.name===sub);const leaves=subObj&&subObj.children&&subObj.children.length?subObj.children.map(c=>({v:c.name,l:c.name})):[];const leafOpts=leaves.length?[{v:'',l:'— Wählen —'},...leaves]:null;
mp.innerHTML=`
<div class="sec"><div class="sec-t">Fotos (${item.images.length})</div><div class="pgrid" id="pg"></div></div>
<div class="sec"><div class="sec-t">Anzeige</div>
<div class="fld"><label>Titel</label><input id="f-title" value="${esc(d.title)}" maxlength="65"></div>
<div class="fld"><label>Beschreibung</label><textarea id="f-desc" rows="5">${esc(d.description)}</textarea></div>
<div class="row"><div class="fld"><label>Preis (€)</label><input id="f-price" value="${esc(d.price)}" inputmode="decimal"></div><div class="fld"><label>Preistyp</label>${sel('f-pt',PT,d.priceType||'FIXED')}</div></div>
<div class="fld" id="f-buynow-row"${(d.priceType||'FIXED')==='FIXED'?'':' style="display:none"'}><label><input type="checkbox" id="f-buynow"${d.buyNow!==false?' checked':''} style="width:auto;margin-right:6px;vertical-align:middle"> Direkt kaufen aktivieren</label></div></div>
<div class="sec"><div class="sec-t">Kategorie</div>
<div class="row"><div class="fld"><label>Hauptkategorie</label>${sel('f-cat1',parentOpts,parent)}</div><div class="fld"><label>Unterkategorie</label>${sel('f-cat2',subOpts,sub)}</div></div>
${leafOpts?`<div class="fld"><label>Detail</label>${sel('f-cat3',leafOpts,leaf)}</div>`:''}</div>
<div class="sec"><div class="sec-t">Zustand</div><div class="fld">${sel('f-cond',CONDS,d.condition||'')}</div></div>
<div class="sec"><div class="sec-t">Versand</div>
<div class="fld"><label>Versandart</label>${sel('f-versand',[{v:'nein',l:'Nur Abholung'},{v:'ja',l:'Versand möglich'},{v:'custom',l:'Individueller Versand'}],versandVal==='ja'||versandVal==='custom'?versandVal:'nein')}</div><div id="shipDet"></div></div>
<div class="sec"><div class="sec-t">Kategorie-Attribute</div><div id="dynF"></div></div>
<div class="sec"><div class="sec-t">Standort</div><div class="row"><div class="fld"><label>PLZ</label><input value="44141" disabled></div><div class="fld"><label>Ort</label><input value="Dortmund - Mitte" disabled></div></div></div>`;
renderPhotos(item);renderShipDet();renderAttrs(item);
document.getElementById('f-cat1').onchange=()=>{const p=document.getElementById('f-cat1').value;const ns=p?getSubcategories(p):[];const s2=document.getElementById('f-cat2');s2.innerHTML='<option value="">— Wählen —</option>'+ns.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');save();renderDetail(item)};
document.getElementById('f-cat2').onchange=()=>{save();renderDetail(item)};
const cat3=document.getElementById('f-cat3');if(cat3)cat3.onchange=()=>{save();renderAttrs(item)};
document.getElementById('f-versand').onchange=()=>{renderShipDet();save()};
document.getElementById('f-pt').onchange=()=>{const row=document.getElementById('f-buynow-row');if(row)row.style.display=document.getElementById('f-pt').value==='FIXED'?'':'none';save()};
mp.querySelectorAll('input:not(:disabled),textarea,select').forEach(el=>{el.addEventListener('change',saveDebounced);el.addEventListener('blur',saveDebounced)})}
function carrierSize(carrierId){if(!SHIPS||!carrierId)return null;const o=SHIPS.find(x=>x.v===carrierId);if(!o||!o.raw)return null;return o.raw.packageSize||null}
function shipsForSize(size){const ships=getShips();if(!size)return ships;return ships.filter(o=>!o.v||(o.raw&&o.raw.packageSize===size))}
function renderShipDet(){const m=document.getElementById('f-versand')?.value;const c=document.getElementById('shipDet');if(!c)return;const d=activeItem?.data||{};const sh=d.shippingOptions||[];
if(m==='ja'){const size0=carrierSize(sh[0]);const size1=carrierSize(sh[1]);const lockedSize=size0||size1;const opts0=shipsForSize(lockedSize);const opts1=shipsForSize(lockedSize);c.innerHTML=`<div class="row" style="margin-top:8px"><div class="fld"><label>Option 1</label>${shipSel('f-s0',opts0,sh[0]||'')}</div><div class="fld"><label>Option 2</label>${shipSel('f-s1',opts1,sh[1]||'')}</div></div>${lockedSize?`<div style="font-size:11px;color:var(--tx2);margin-top:4px">Größe: ${esc(lockedSize)} (alle Optionen müssen gleiche Größe haben)</div>`:''}`;
const s0=document.getElementById('f-s0'),s1=document.getElementById('f-s1');
const onChange=()=>{const v0=s0.value,v1=s1.value;const size=carrierSize(v0)||carrierSize(v1);if(size){if(v0&&carrierSize(v0)!==size)s0.value='';if(v1&&carrierSize(v1)!==size)s1.value=''}save();renderShipDet()};
s0.addEventListener('change',onChange);s1.addEventListener('change',onChange)}
else if(m==='custom'){c.innerHTML=`<div class="fld" style="margin-top:8px"><label>Versandkosten (€)</label><input id="f-shipcost" value="${esc(d.customShippingCost||'')}" inputmode="decimal"></div>`;const inp=c.querySelector('input');inp.addEventListener('change',saveDebounced);inp.addEventListener('blur',saveDebounced)}
else{c.innerHTML=''}}
function renderAttrs(item){const c=document.getElementById('dynF');if(!c)return;c.innerHTML='';const d=item.data;const cat1=document.getElementById('f-cat1')?.value;const cat2=document.getElementById('f-cat2')?.value;const cat3=document.getElementById('f-cat3')?.value;const subs=cat1?getSubcategories(cat1):[];const sub=subs.find(s=>s.name===cat2);
if(!sub){c.innerHTML='<div style="color:var(--tx2);font-size:12px">Kategorie wählen um Attribute zu sehen</div>';return}
// Schemas are keyed by the sub-category id (numeric). Leaves don't have their own schema.
// If the sub-category has children, still require the leaf to be picked before showing attrs (otherwise art_s isn't pinned yet).
if(sub.children&&sub.children.length&&!cat3){c.innerHTML='<div style="color:var(--tx2);font-size:12px">Detail-Kategorie wählen um Attribute zu sehen</div>';return}
const schema=getSchema(sub.id);if(!schema||!schema.attributes||Object.keys(schema.attributes).length===0){c.innerHTML='<div style="color:var(--tx2);font-size:12px">Keine Attribute für diese Kategorie</div>';return}
const dynVals={};if(d.dynamicFields)for(const[k,v]of Object.entries(d.dynamicFields)){dynVals[k.replace(/_s$/,'')]=v}
const acVals={};if(d.autocompleteFields)for(const[k,v]of Object.entries(d.autocompleteFields)){acVals[k]=v}
for(const[key,attr]of Object.entries(schema.attributes)){if(key.includes('versand')||key.includes('condition'))continue;if(attr.fakeSubCategory)continue;const cur=dynVals[key]||'';const div=document.createElement('div');div.className='fld';
if(attr.options.length>0&&attr.options.length<=200){const opts=[{v:'',l:'— Wählen —'},...attr.options.map(o=>({v:o.value,l:o.label}))];div.innerHTML=`<label>${esc(attr.name)}${attr.required?' *':''}</label>${sel('dyn-'+key,opts,cur)}`}
else if(attr.options.length>200){
  // Big option lists (e.g. 838 brand options) render as a free-text field with a label-style value.
  // We display the human label from autocompleteFields if we have one, otherwise the option's label.
  const labelKey=Object.keys(acVals).find(k=>k.replace(/-input$/,'')===key.split('.').pop()||k===key+'-input')||(key.endsWith('.brand')?'brands-input':null);
  const curLabel=labelKey?acVals[labelKey]:(attr.options.find(o=>o.value===cur)||{}).label||'';
  div.innerHTML=`<label>${esc(attr.name)}${attr.required?' *':''}</label><input class="dyn-input ac" data-key="${esc(key)}" data-ackey="${esc(labelKey||'')}" list="dl-${esc(key)}" value="${esc(curLabel)}"><datalist id="dl-${esc(key)}">${attr.options.slice(0,1000).map(o=>`<option value="${esc(o.label)}">${esc(o.value)}</option>`).join('')}</datalist>`;
}
else{div.innerHTML=`<label>${esc(attr.name)}${attr.required?' *':''}</label><input class="dyn-input" data-key="${esc(key)}" value="${esc(cur)}">`}
c.appendChild(div)}
c.querySelectorAll('select,input').forEach(el=>{el.addEventListener('change',saveDebounced);el.addEventListener('blur',saveDebounced)})}
async function renderPhotos(item){const grid=document.getElementById('pg');if(!grid)return;grid.innerHTML='';
for(let i=0;i<item.images.length;i++){const img=item.images[i];const div=document.createElement('div');div.className='pitem';div.draggable=true;
div.ondragstart=e=>{dragIdx=i;div.classList.add('dragging');e.dataTransfer.effectAllowed='move'};div.ondragend=()=>{div.classList.remove('dragging');dragIdx=null};div.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};
div.ondrop=e=>{e.preventDefault();if(dragIdx===null||dragIdx===i)return;const moved=item.images.splice(dragIdx,1)[0];item.images.splice(i,0,moved);item.data.photoOrder=[...item.images];save();renderPhotos(item);renderList()};
const imgEl=document.createElement('img');const tp=await window.api.getThumbnail(item.path+'/'+img);imgEl.src='file://'+tp;div.appendChild(imgEl);
const num=document.createElement('span');num.className='num';num.textContent=i+1;div.appendChild(num);
if(i===0){const b=document.createElement('span');b.className='badge';b.textContent='Titelbild';div.appendChild(b)}
const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=async e=>{e.stopPropagation();await window.api.removePhoto(item.path,img);item.images.splice(i,1);item.data.photoOrder=[...item.images];save();renderPhotos(item);renderList()};div.appendChild(rm);grid.appendChild(div)}
const add=document.createElement('button');add.className='padd';add.innerHTML='<span style="font-size:20px">+</span><span>Hinzufügen</span>';add.onclick=async()=>{const added=await window.api.addPhotos(item.path);if(added.length){item.images.push(...added);item.data.photoOrder=[...item.images];save();renderPhotos(item);renderList()}};grid.appendChild(add)}
async function save(){if(!activeItem)return;const d=activeItem.data;
// Any user edit invalidates the "posted" mark — the next render and the next bulk-post run will treat the item as fresh.
delete d.posted;
const g=id=>document.getElementById(id)?.value||'';d.title=g('f-title');d.description=g('f-desc');d.price=g('f-price');d.priceType=g('f-pt');d.condition=g('f-cond');d.zipCode='44141';d.photoOrder=[...activeItem.images];
d.buyNow=document.getElementById('f-buynow')?.checked!==false;
const c1=g('f-cat1'),c2=g('f-cat2'),c3=g('f-cat3');d.categoryPath=[c1,c2,c3].filter(Boolean).join(' > ');
const vm=g('f-versand');d.versandMode=vm||'nein';const sh=[];if(vm==='ja'){const s0=g('f-s0'),s1=g('f-s1');if(s0)sh.push(s0);if(s1)sh.push(s1);d.shippingOptions=sh;delete d.customShippingCost}
else if(vm==='custom'){d.shippingOptions=[];d.customShippingCost=g('f-shipcost')}
else{d.shippingOptions=[];delete d.customShippingCost}
if(!d.dynamicFields)d.dynamicFields={};
// Sync the .art_s attribute with the chosen leaf, if the sub-category has children.
// categories.json stores fieldName as "attributeMap[X_s]"; canonicalize to bare X.
const canonicalKey=fn=>{const m=String(fn||'').match(/^attributeMap\[(.+?)_s\]$/)||String(fn||'').match(/^attributeMap\[(.+)\]$/);return m?m[1]:fn};
if(c1&&c2&&c3){const subs=getSubcategories(c1);const subObj=subs.find(s=>s.name===c2);const leafObj=subObj&&subObj.children?subObj.children.find(x=>x.name===c3):null;if(leafObj&&leafObj.fieldName){const k=canonicalKey(leafObj.fieldName);d.dynamicFields[k]=leafObj.fieldValue}}
document.querySelectorAll('#dynF select,#dynF input.dyn-input').forEach(el=>{const key=el.id?.startsWith('dyn-')?el.id.substring(4):el.dataset?.key;if(!key)return;
if(el.classList.contains('ac')){
  // Autocomplete brand-style field: el.value is the human label; resolve to the option ID via the datalist.
  const label=el.value||'';const dl=el.list;let optVal='';if(dl){for(const o of dl.options){if(o.value.toLowerCase()===label.toLowerCase()){optVal=o.textContent||'';break}}}
  if(!d.autocompleteFields)d.autocompleteFields={};
  const acKey=el.dataset?.ackey||(key.endsWith('.brand')?'brands-input':key+'-input');
  d.autocompleteFields[acKey]=label;
  d.dynamicFields[key]=optVal||label;
}else{
  d.dynamicFields[key]=el.value;
}});
await window.api.saveItem(activeItem.path,d)}
function updBulk(){const b=document.getElementById('bulkBtn');b.textContent=`Posten (${bulkSel.size})`;b.disabled=bulkSel.size===0;document.getElementById('bulkCount').textContent=`${bulkSel.size} ausgewählt`;document.getElementById('bulkBar').className=bulkSel.size>0?'bbar vis':'bbar';document.getElementById('mp').classList.toggle('has-bbar',bulkSel.size>0)}
function bulkSelectAll(){for(const it of items)bulkSel.add(it.path);updBulk();renderList()}
function bulkClear(){bulkSel.clear();updBulk();renderList()}
async function runBulk(){
  if(!bulkSel.size)return;
  await flushSave();
  const ok=await showConfirm(`${bulkSel.size} Anzeige(n) jetzt veröffentlichen?`,`Klick "Posten" und die Anzeigen werden nacheinander auf kleinanzeigen.de veröffentlicht. Erfolgreich gepostete Items werden mit Datum markiert und ans Listenende sortiert.`);
  if(!ok)return;
  status(`Upload von ${bulkSel.size} Anzeigen...`);
  document.getElementById('bulkBtn').disabled=true;
  const r=await window.api.runAutomation([...bulkSel],{submit:true});
  const okN=r.filter(x=>x.success).length,fail=r.filter(x=>!x.success).length;
  status(`Fertig: ${okN} gepostet, ${fail} fehlgeschlagen`);
  bulkSel.clear();
  await reloadItems();
  document.getElementById('bulkBtn').disabled=false;
}
function populateBulkSelects(){const ships=getShips();const s0=document.getElementById('be-s0'),s1=document.getElementById('be-s1');if(!s0||!s1)return;
const groupBuild=(placeholder)=>{const groups={SMALL:[],MEDIUM:[],LARGE:[],OTHER:[]};for(const o of ships){if(!o.v)continue;const g=(o.raw&&o.raw.packageSize)||'OTHER';groups[g].push(o)}const labels={SMALL:'Klein',MEDIUM:'Mittel',LARGE:'Groß',OTHER:'Sonstige'};const optHtml=o=>`<option value="${esc(o.v)}"${o.raw&&o.raw.description?` title="${esc(o.raw.description)}"`:''}>${esc(o.l)}</option>`;let out=`<option value="">${placeholder}</option>`;for(const g of ['SMALL','MEDIUM','LARGE','OTHER']){if(!groups[g].length)continue;out+=`<optgroup label="${labels[g]}">${groups[g].map(optHtml).join('')}</optgroup>`}return out};
s0.innerHTML=groupBuild('Versandart 1…');s1.innerHTML=groupBuild('Versandart 2…')}
async function bulkApplyVersand(){const v=document.getElementById('be-versand').value;if(!bulkSel.size||!v)return;const row=document.getElementById('be-ship-row');if(v==='ja'){row.style.display='flex';status('Versandmethoden wählen, dann OK');return}row.style.display='none';const r=await window.api.bulkUpdate([...bulkSel],{versandMode:v});await reloadItems();status(`${r.length} Anzeigen aktualisiert`)}
async function bulkApplyShipping(){if(!bulkSel.size)return;const s0=document.getElementById('be-s0').value,s1=document.getElementById('be-s1').value;const sh=[s0,s1].filter(Boolean);const r=await window.api.bulkUpdate([...bulkSel],{versandMode:'ja',shippingOptions:sh});await reloadItems();status(`${r.length} Anzeigen aktualisiert`)}
async function bulkApplyBuyNow(){const v=document.getElementById('be-buynow').value;if(!bulkSel.size||!v)return;const r=await window.api.bulkUpdate([...bulkSel],{buyNow:v==='true'});await reloadItems();status(`${r.length} Anzeigen aktualisiert`)}
async function reloadItems(){const{items:r}=await window.api.getItems();items=r;if(activeItem){const upd=items.find(x=>x.path===activeItem.path);activeItem=upd||null}renderList();if(activeItem)renderDetail(activeItem)}
function showPrompt(title,defaultValue){return new Promise(resolve=>{const bd=document.createElement('div');bd.className='modal-bd';bd.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><input id="m-input" value="${esc(defaultValue||'')}"><div class="actions"><button id="m-cancel">Abbrechen</button><button class="primary" id="m-ok">OK</button></div></div>`;document.body.appendChild(bd);const input=bd.querySelector('#m-input');setTimeout(()=>input.focus(),0);const close=v=>{document.body.removeChild(bd);resolve(v)};bd.querySelector('#m-cancel').onclick=()=>close(null);bd.querySelector('#m-ok').onclick=()=>close(input.value.trim()||null);input.onkeydown=e=>{if(e.key==='Enter')close(input.value.trim()||null);if(e.key==='Escape')close(null)};bd.onclick=e=>{if(e.target===bd)close(null)}})}
function showConfirm(title,message){return new Promise(resolve=>{const bd=document.createElement('div');bd.className='modal-bd';bd.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><p style="margin-bottom:12px;font-size:13px;color:var(--tx2);line-height:1.5">${esc(message||'')}</p><div class="actions"><button id="m-cancel">Abbrechen</button><button class="primary" id="m-ok">Posten</button></div></div>`;document.body.appendChild(bd);const close=v=>{document.body.removeChild(bd);document.removeEventListener('keydown',onKey);resolve(v)};const onKey=e=>{if(e.key==='Escape')close(false);else if(e.key==='Enter')close(true)};bd.querySelector('#m-cancel').onclick=()=>close(false);bd.querySelector('#m-ok').onclick=()=>close(true);bd.onclick=e=>{if(e.target===bd)close(false)};document.addEventListener('keydown',onKey);setTimeout(()=>bd.querySelector('#m-ok').focus(),0)})}
async function newItem(){await flushSave();const name=await showPrompt('Name der neuen Anzeige');if(!name)return;await window.api.createItem(name);await reloadItems()}
async function refreshShipping(){status('Aktualisiere Versand-Preise…');const r=await window.api.refreshShipping();if(!r.ok){status('Fehler: '+r.error);return}const data=await window.api.getShippingOptions();setShips(data);populateBulkSelects();if(activeItem)renderDetail(activeItem);status(`Versand-Preise aktualisiert (${r.count} Optionen)`)}
async function changeFolder(){await flushSave();const f=await window.api.selectFolder();if(f){activeItem=null;await reloadItems();document.getElementById('mp').className='main empty';document.getElementById('mp').innerHTML='<span>Wähle ein Item</span>'}}
async function refreshChromeStatus(){const s=await window.api.chromeStatus();const b=document.getElementById('chromeBtn');if(!b)return;b.className=s.running?'chrome-on':'';b.title=s.running?`Chrome verbunden (Port ${s.port})`:'Chrome mit Debug-Port starten'}
async function launchChrome(){const b=document.getElementById('chromeBtn');b.disabled=true;status('Starte Chrome…');const r=await window.api.launchChrome();b.disabled=false;if(!r.ok){status('Fehler: '+r.error);return}status(r.alreadyRunning?'Chrome läuft bereits':'Chrome gestartet');refreshChromeStatus()}
setInterval(refreshChromeStatus,3000);refreshChromeStatus();
window.api.onAutomationProgress&&window.api.onAutomationProgress(d=>{const name=d.itemPath?.split('/').pop()||'';if(d.phase==='start')status(`(${d.index+1}/${d.total}) ${name}…`);else if(d.phase==='done'){if(!d.success)status(`(${d.index+1}/${d.total}) ${name}: ${d.error}`)}});
function status(m){const b=document.getElementById('sbar');b.textContent=m;b.className='sbar vis';setTimeout(()=>b.className='sbar',5000)}
init();
</script>
